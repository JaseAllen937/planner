<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hub">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="hub.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Hub · AgendaAI</title>
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { height: 100vh; height: 100dvh; min-height: 0; }

  .hub {
    display: flex; flex-direction: column;
    height: 100%; width: 100%; max-width: 720px; margin: 0 auto;
    background: var(--bg);
  }

  /* ---- Header ---- */
  .hub-head {
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 8px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .hub-head h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
  .hub-head-links { display: flex; gap: 14px; align-items: center; font-size: 14px; }
  .hub-head-links a, .hub-link {
    color: var(--accent); text-decoration: none; font-weight: 500;
    background: none; border: none; padding: 6px 0; cursor: pointer; font-size: 14px;
  }
  .hub-head-links a:hover, .hub-link:hover { text-decoration: underline; }

  /* ---- Quick buttons ---- */
  .hub-quick {
    display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--border); scrollbar-width: none;
  }
  .hub-quick::-webkit-scrollbar { display: none; }
  .hub-quick .btn { min-height: 34px; padding: 6px 14px; font-size: 14px; flex: 0 0 auto; background: var(--card); border: 1px solid var(--border); }

  /* ---- Message list ---- */
  .hub-list-wrap { position: relative; flex: 1; min-height: 0; }
  .hub-list {
    height: 100%; overflow-y: auto; padding: 12px 16px 16px;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .hub-older { display: flex; justify-content: center; margin: 4px 0 12px; }
  .hub-older .btn { min-height: 32px; padding: 4px 14px; font-size: 13px; }
  .hub-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 11px; font-weight: 600; margin: 14px 0 6px;
  }
  .hub-divider::before, .hub-divider::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
  .hub-empty { color: var(--muted); text-align: center; padding: 48px 16px; font-size: 14px; }

  .hub-day {
    text-align: center; color: var(--muted); font-size: 12px; font-weight: 600;
    margin: 16px 0 8px; letter-spacing: 0.02em;
  }
  .hub-msg { display: flex; flex-direction: column; margin: 6px 0; }
  .hub-msg.me { align-items: flex-end; }
  .hub-msg.them { align-items: flex-start; }
  .hub-bubble {
    max-width: 85%; padding: 9px 13px; border-radius: 18px;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
    font-size: 15px; line-height: 1.4;
  }
  .hub-msg.me .hub-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
  .hub-msg.them .hub-bubble { background: var(--card); color: var(--text); border-bottom-left-radius: 6px; box-shadow: var(--shadow-sm); }
  .hub-bubble a { color: var(--accent); text-decoration: underline; }
  .hub-time { color: var(--muted); font-size: 11px; margin: 3px 6px 0; }

  .hub-status {
    text-align: center; color: var(--muted); font-size: 12px;
    margin: 8px 24px; white-space: pre-wrap; overflow-wrap: anywhere;
  }

  .hub-card {
    max-width: 90%; background: var(--card); border: 1px solid var(--border-strong);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .hub-card-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.4; }
  .hub-card-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .hub-card-row .btn { min-height: 38px; padding: 6px 18px; font-size: 14px; }
  .hub-card-row .btn:disabled { opacity: 0.5; cursor: default; }
  .hub-card-note { color: var(--muted); font-size: 13px; margin-top: 10px; }

  .hub-pill {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    box-shadow: var(--shadow-lg);
  }

  /* ---- Notices, working line, composer ---- */
  .hub-notice {
    margin: 6px 16px 0; padding: 8px 12px; border-radius: var(--radius-sm);
    font-size: 13px; background: var(--card); border: 1px solid var(--border); color: var(--muted);
  }
  .hub-notice.setup { color: var(--danger); border-color: var(--danger-dim); }
  .hub-working { padding: 6px 16px 0; font-size: 13px; color: var(--muted); }
  .hub-working.warn { color: var(--danger); }
  .hub-dots::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: hub-dots 1.2s steps(4, end) infinite; }
  @keyframes hub-dots {
    0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; }
  }

  .hub-composer {
    padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
    border-top: 1px solid var(--border); margin-top: 6px;
  }
  .hub-compose-row { display: flex; gap: 8px; align-items: flex-end; }
  .hub-compose-row textarea {
    flex: 1; resize: none; border: 1px solid var(--border-strong); border-radius: 18px;
    background: var(--card); color: var(--text); padding: 9px 14px;
    font-size: 16px; line-height: 22px; min-height: 42px; max-height: calc(22px * 6 + 20px); overflow-y: auto;
    outline: none;
  }
  .hub-compose-row textarea:focus { border-color: var(--accent); }
  .hub-compose-row .btn { min-height: 42px; border-radius: 21px; }
  .hub-compose-row .btn:disabled { opacity: 0.5; cursor: default; }
  .hub-compose-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-top: 4px; min-height: 0; }
  .hub-err { color: var(--danger); overflow-wrap: anywhere; }
  .hub-count { color: var(--muted); margin-left: auto; }
  .hub-count.over { color: var(--danger); }

  /* ---- Attachments ---- */
  .hub-compose-row .hub-attach {
    flex: 0 0 auto; width: 42px; min-width: 42px; padding: 0;
    background: var(--card); border: 1px solid var(--border); color: var(--muted);
  }
  .hub-attach svg { width: 20px; height: 20px; display: block; }
  .hub-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; max-width: 100%; }
  .hub-composer .hub-chips { margin-bottom: 8px; }
  .hub-msg.me .hub-chips { justify-content: flex-end; max-width: 85%; margin-top: 4px; }
  .hub-chip {
    display: inline-flex; align-items: center; gap: 2px; min-width: 0; max-width: 100%;
    padding: 4px 10px; border-radius: 999px; font-size: 13px; line-height: 18px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
  }
  .hub-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .hub-chip-x {
    flex: 0 0 auto; border: none; background: none; color: var(--muted); cursor: pointer;
    font-size: 17px; line-height: 18px; padding: 0 0 0 4px; margin-right: -4px;
  }

  /* ---- Sign-in ---- */
  .hub-signin { flex: 1; overflow-y: auto; padding: 32px 16px; }
  .hub-signin form {
    max-width: 360px; margin: 0 auto; background: var(--card);
    border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; gap: 10px;
  }
  .hub-signin h2 { margin: 0 0 4px; font-size: 18px; }
  .hub-signin p { margin: 0 0 6px; color: var(--muted); font-size: 13px; }
  .hub-signin input {
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 16px; background: var(--card); color: var(--text);
  }
  .hub-signin .btn:disabled { opacity: 0.5; }

  /* ---- Recaps (Oct 31): plan posts and change cards ---- */
  /* Markers match the Next 3 days card: blue capsule = study block, graphite = event,
     red diamond = due, ring = to-do. */
  .hub { --n3-block: linear-gradient(90deg, #0a84ff 0%, #5e5ce6 100%); --n3-event: rgba(60, 60, 67, 0.42); --n3-glow: rgba(10, 132, 255, 0.38); }
  .hub-p { margin: 0 0 8px; }
  .hub-p:last-child { margin-bottom: 0; }
  .hub-recap {
    max-width: 92%; background: var(--card); color: var(--text);
    border-radius: 20px; border-bottom-left-radius: 6px; padding: 12px 14px;
    box-shadow: var(--shadow-sm); font-size: 15px; line-height: 1.45; overflow-wrap: anywhere;
  }
  .hub-recap-plan {
    width: 92%; border: 1px solid rgba(10, 132, 255, 0.18);
    background: linear-gradient(180deg, rgba(10, 132, 255, 0.07) 0, rgba(10, 132, 255, 0) 140px), var(--card);
  }
  .hub-recap-head { display: flex; flex-direction: column; gap: 3px; padding-bottom: 12px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .hub-recap-kind { font-size: 12px; font-weight: 600; color: var(--accent); }
  .hub-recap-title { font-size: 19px; font-weight: 750; letter-spacing: -0.02em; line-height: 1.2; }
  .hub-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .hub-stat {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 9px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--border); font-size: 13px; color: var(--muted);
  }
  .hub-stat b { font-family: var(--font-mono); font-weight: 600; color: var(--text); }
  .hub-recap-note { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }
  .hub-sec { margin: 12px 0 0; }
  .hub-sec-head { font-size: 13px; font-weight: 650; color: var(--text); margin-bottom: 4px; }
  .hub-ul { margin: 0; padding: 0; list-style: none; }
  .hub-ul li { position: relative; padding: 3px 0 3px 16px; font-size: 14px; line-height: 1.4; }
  .hub-ul li::before {
    content: ''; position: absolute; left: 3px; top: 0.78em; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); opacity: 0.55;
  }
  .hub-sec-quiet .hub-ul li { color: var(--muted); }
  .hub-sec-quiet .hub-ul li::before { background: var(--text-tertiary); opacity: 1; }
  .hub-sec-warn .hub-sec-head { color: var(--danger); }
  .hub-sec-warn .hub-ul li::before { background: var(--danger); }
  .hub-sec-ask { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px 12px; }
  .hub-sec-ask .hub-sec-head { color: var(--accent); }
  .hub-sec-foot { margin: 8px 0 0; font-size: 14px; font-weight: 600; }
  .hub-more {
    margin-top: 2px; background: none; border: none; padding: 6px 0 2px; cursor: pointer;
    color: var(--accent); font-size: 13px; font-weight: 600;
  }
  .hub-more-note { font-size: 12px; color: var(--text-tertiary); padding: 2px 0 0 16px; }
  .hub-mark { display: inline-block; flex: 0 0 auto; }
  .hub-mark-block, .hub-mark-event { width: 4px; height: 14px; border-radius: 2px; }
  .hub-mark-block { background: var(--n3-block); box-shadow: 0 0 6px var(--n3-glow); }
  .hub-mark-event { background: var(--n3-event); }
  .hub-mark-due { width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: var(--danger); }
  .hub-mark-todo { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--text-tertiary); box-sizing: border-box; }
  .hub-mark-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-tertiary); }

  .hub-card-change {
    width: 92%; border: 1px solid var(--border); box-shadow: var(--shadow-sm);
    border-radius: 20px; border-bottom-left-radius: 6px; padding: 12px 14px;
  }
  .hub-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .hub-card-num { font-family: var(--font-mono); font-size: 12px; color: var(--text-tertiary); }
  .hub-card-title { font-size: 15px; font-weight: 650; flex: 1; min-width: 0; }
  .hub-card-count {
    font-family: var(--font-mono); font-size: 12px; color: var(--muted);
    background: var(--surface-inset); border-radius: 999px; padding: 2px 9px;
  }
  .hub-ops { display: flex; flex-direction: column; }
  .hub-op-day { font-size: 12px; font-weight: 650; color: var(--muted); margin: 10px 0 2px; }
  .hub-op-day:first-child { margin-top: 0; }
  .hub-op {
    display: grid; grid-template-columns: 8px 40px minmax(0, 1fr) auto; align-items: center; column-gap: 8px;
    padding: 4px 0; font-size: 14px; line-height: 1.35;
  }
  .hub-op .hub-mark { justify-self: center; }
  .hub-op-when { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .hub-op-due .hub-op-when { color: var(--danger); font-weight: 600; }
  .hub-op-due .hub-op-title { font-weight: 600; }
  .hub-op-title { min-width: 0; overflow-wrap: anywhere; }
  .hub-op-dur { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  .hub-op-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .hub-mark-move, .hub-mark-del, .hub-mark-back, .hub-mark-check, .hub-mark-uncheck, .hub-mark-log {
    width: auto; height: auto; font-size: 13px; line-height: 1; font-weight: 700;
  }
  .hub-mark-move::before { content: '\2192'; color: var(--accent); }
  .hub-mark-back::before { content: '\21BA'; color: var(--accent); }
  .hub-mark-del::before { content: '\2715'; color: var(--text-tertiary); font-size: 11px; }
  .hub-mark-check::before { content: '\2713'; color: var(--ok); }
  .hub-mark-uncheck::before { content: '\2013'; color: var(--text-tertiary); }
  .hub-mark-log::before { content: '\2022'; color: var(--accent); }
  .hub-mark-allday { width: 4px; height: 14px; border-radius: 2px; background: var(--n3-event); }
  .hub-op-del .hub-op-title { color: var(--muted); text-decoration: line-through; }
  .hub-op-del .hub-op-sub { text-decoration: none; display: none; }
  .hub-recap-ops { width: 92%; }
  .hub-bubble-warn { background: var(--card); border: 1px solid rgba(255, 59, 48, 0.28); color: var(--text); }
  .hub-bubble-warn::before { content: 'Needs a look'; display: block; font-size: 12px; font-weight: 600; color: var(--danger); margin-bottom: 2px; }

  /* /today */
  .hub-today .hub-recap-head { padding-bottom: 8px; }
  .hub-kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); column-gap: 10px; row-gap: 8px; align-items: baseline; }
  .hub-kv-k { font-size: 12px; font-weight: 600; color: var(--muted); }
  .hub-kv-sub { font-weight: 500; color: var(--text-tertiary); }
  .hub-kv-space { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 4px; }
  .hub-kv-v { font-size: 14px; line-height: 1.4; min-width: 0; }
  .hub-kv-v .hub-op { grid-template-columns: 8px 38px minmax(0, 1fr); padding: 2px 0; }
  .hub-pips { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 6px; }
  .hub-pips i { width: 8px; height: 8px; border-radius: 3px; background: var(--surface-inset); }
  .hub-pips i.on { background: var(--n3-block); box-shadow: 0 0 4px var(--n3-glow); }

  /* memory */
  .hub-memory { width: 92%; }
  .hub-recap-head-tight { padding-bottom: 6px; margin-bottom: 8px; }
  .hub-diff { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .hub-diff-row { display: grid; grid-template-columns: 66px minmax(0, 1fr); column-gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.4; }
  .hub-diff-tag { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px; text-align: center; }
  .hub-diff-add .hub-diff-tag { color: #1f8a3b; background: var(--ok-dim); }
  .hub-diff-chg .hub-diff-tag { color: #b86e00; background: rgba(255, 159, 10, 0.14); }
  .hub-diff-del .hub-diff-tag { color: var(--danger); background: var(--danger-dim); }
  .hub-diff-del .hub-diff-t { color: var(--muted); text-decoration: line-through; }

  /* approvals that aren't AgendaAI changes */
  .hub-mail { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--panel-2); }
  .hub-mail-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); column-gap: 8px; font-size: 13px; line-height: 1.5; }
  .hub-mail-k { color: var(--muted); }
  .hub-mail-v { overflow-wrap: anywhere; }
  .hub-mail-body { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .hub-pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: 12px; background: var(--panel-2); border-radius: 10px; padding: 10px; }
  .hub-card-why { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-tertiary); }
  .btn.hub-undo {
    background: var(--surface-inset); color: var(--text); border: none; border-radius: 999px;
    min-height: 34px; padding: 6px 16px; font-weight: 600;
  }
  .btn.hub-undo::before { content: '\21B6'; margin-right: 6px; }

  .hub-ask-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; row-gap: 1px; }
  .hub-ask-title { font-weight: 600; }
  .hub-ask-date {
    align-self: start; font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--card); border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }
  .hub-ask-why { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .hub-handoff {
    display: block; max-width: 92%;
    padding: 8px 12px; border-radius: 14px; border: 1px dashed rgba(10, 132, 255, 0.35);
    color: var(--muted); font-size: 13px; line-height: 1.4;
  }
  .hub-handoff::before { content: 'From a Claude chat'; display: block; margin-bottom: 2px; color: var(--accent); font-weight: 600; }
  .hub-handoff-dot { display: none; }

  /* ---- Review cards (Oct 31) ---- */
  .rv { width: 92%; }
  .rv-updated { margin-left: 6px; font-size: 11px; font-weight: 700; color: #b86e00; background: rgba(255, 159, 10, 0.14); border-radius: 6px; padding: 1px 6px; }
  .rv-sec { margin-top: 16px; }
  .rv-sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .rv-sec-t { font-size: 13px; font-weight: 650; color: var(--text); }
  .rv-sec-n { font-size: 12px; color: var(--muted); text-align: right; }
  .rv-sec-n b { font-family: var(--font-mono); font-weight: 600; color: var(--text); }
  .rv-grid { display: grid; grid-template-columns: 78px repeat(var(--cols), minmax(0, 1fr)) 36px; column-gap: 4px; row-gap: 5px; align-items: center; }
  .rv-grid-long { column-gap: 2px; row-gap: 4px; }
  .rv-day { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); text-align: center; white-space: nowrap; overflow: visible; }
  .rv-grid-long .rv-day { text-align: left; }
  .rv-lab { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-cnt { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; }
  .rv-c { display: block; height: 16px; border-radius: 5px; }
  .rv-grid-long .rv-c { height: 12px; border-radius: 3px; }
  .rv-c-on { background: var(--n3-block); box-shadow: 0 1px 4px var(--n3-glow); }
  .rv-c-open { background: var(--surface-inset); }
  .rv-c-off { background: repeating-linear-gradient(135deg, var(--surface-inset) 0 2px, transparent 2px 5px); }
  .rv-c-none { background: radial-gradient(circle, var(--text-tertiary) 1px, transparent 1.5px) center / 6px 6px; opacity: 0.6; }
  .rv-key { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .rv-key span { display: inline-flex; align-items: center; gap: 5px; }
  .rv-key .rv-c { width: 12px; height: 9px; border-radius: 3px; }
  .rv-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .rv-gridline { stroke: rgba(60, 60, 67, 0.08); }
  .rv-axis { font-family: var(--font-mono); font-size: 8.5px; fill: rgba(60, 60, 67, 0.45); }
  .rv-axis-left { text-anchor: start; }
  .rv-zero { fill: rgba(60, 60, 67, 0.12); }
  .rv-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .rv-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .rv-plans { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .rv-plan { border: 1px solid var(--border); border-radius: 12px; padding: 8px 6px; text-align: center; }
  .rv-plan b { display: block; font-family: var(--font-mono); font-size: 18px; color: var(--text); }

  .hub-in { animation: hub-rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes hub-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .hub-working { display: flex; align-items: center; gap: 8px; }

  .hub-typing i:nth-child(2) { animation-delay: 0.15s; }
  .hub-typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes hub-blink { 0%, 80%, 100% { opacity: 0.25; transform: none; } 40% { opacity: 1; transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) {
