<script>
'use strict';

// ---- Supabase config (copied from index.html) ----
const SUPABASE_URL = "https://jmvetxcxvabrzoppoxwm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptdmV0eGN4dmFicnpvcHBveHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NjQ5NDgsImV4cCI6MjA5NzI0MDk0OH0.R1ll_ccsBp4t4D3lDm7ZFJJAlKVekPaw907wUQm7bZw";

// The Hub's own session. Supabase rotates refresh tokens on every use, so
// sharing the app's session key would sign the app out. Never touch it.
const HUB_SESSION_KEY = 'agendaai_hub_session';   // { access_token, refresh_token, user_id, email }

// `files` is dropped for the page's life if this Supabase doesn't have the column yet.
let SELECT = 'select=id,created_at,role,body,buttons,ref_id,status,files,data';
const PAGE = 100;
const POLL_LIMIT = 30;
const MAX_LEN = 4000;
const COUNT_FROM = 3500;
const STALE_MS = 45000;
const SILENT_MS = 5 * 60 * 1000;   // "Working…" with no new rows this long -> 'silent'
const FAST_MS = 1000;   // while a reply is coming (Oct 30: was 2500; faster replies)
const SLOW_MS = 10000;
const CONVO_GAP_MS = 45 * 60 * 1000;   // the PC ends a conversation after this much quiet
const AWAY_MS = 5 * 60 * 1000;         // hidden this long -> back to the bottom on return
const MAX_FILES = 3;
const MAX_FILE_BYTES = 10 * 1024 * 1024;   // the hub-files bucket's per-file limit
const FILE_EXTS = ['pdf', 'png', 'jpg', 'jpeg', 'webp', 'gif', 'txt', 'md', 'csv', 'docx'];

const COMMAND_LABELS = {
  '/today': 'Today',
  '/morning': 'Morning check-in',
  '/night': 'Night check-in',
  '/review': 'Sunday review',
  '/report': 'Report',
  '/new': 'New chat'
};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// ---- Session (Hub key only) ----

function getHubSession() {
  try {
    const raw = localStorage.getItem(HUB_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function setHubSession(s) {
  try { localStorage.setItem(HUB_SESSION_KEY, JSON.stringify(s)); } catch {}
}
function clearHubSession() {
  try { localStorage.removeItem(HUB_SESSION_KEY); } catch {}
}

// ---- Auth (same requests as supaSignIn / supaRefreshToken) ----

async function hubSignIn(email, password) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error_description || data.msg || data.error || `Sign-in failed (${r.status})`);
  setHubSession({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    user_id: data.user.id,
    email: data.user.email
  });
}

// Shared so two requests that hit 401 together don't both spend the
// (single-use) refresh token.
let refreshInFlight = null;
function hubRefreshToken() {
  if (!refreshInFlight) {
    refreshInFlight = (async () => {
      const session = getHubSession();
      if (!session || !session.refresh_token) return false;
      try {
        const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
          method: 'POST',
          headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: session.refresh_token })
        });
        if (!r.ok) return false;
        const data = await r.json();
        if (!data.access_token) return false;
        setHubSession({
          access_token: data.access_token,
          refresh_token: data.refresh_token || session.refresh_token,
          user_id: session.user_id,
          email: session.email
        });
        return true;
      } catch { return false; }
    })().finally(() => { refreshInFlight = null; });
  }
  return refreshInFlight;
}

class HubError extends Error {
  constructor(message, status, code) { super(message); this.status = status; this.code = code; }
}
function isMissingTable(e) {
  return e && (e.status === 404 || e.code === 'PGRST205');
}

// Like supaFetch: apikey + bearer, one 401 -> refresh -> retry. A failed
// refresh clears only the Hub session and shows the sign-in form.
async function hubFetch(path, opts = {}) {
  const session = getHubSession();
  if (!session) { showSignIn(); throw new HubError('Not signed in', 401); }

  const buildOpts = (token) => ({
    ...opts,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });

  let r = await fetch(`${SUPABASE_URL}/rest/v1${path}`, buildOpts(session.access_token));
  if (r.status === 401) {
    const refreshed = await hubRefreshToken();
    if (!refreshed) {
      clearHubSession();
      showSignIn('Your Hub sign-in expired. Please sign in again.');
      throw new HubError('Session expired', 401);
    }
    r = await fetch(`${SUPABASE_URL}/rest/v1${path}`, buildOpts(getHubSession().access_token));
  }
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    let code, msg;
    try { const j = JSON.parse(txt); code = j.code; msg = j.message; } catch {}
    throw new HubError(msg || `Request failed (${r.status})`, r.status, code);
  }
  return r;
}

// GETs hub_messages with SELECT. An older table without `files` answers
// 42703 naming it: drop the column for the rest of the page's life and retry once.
async function getRows(query) {
  const get = async () => (await hubFetch(`/hub_messages?${SELECT}${query}`, { method: 'GET' })).json();
  try {
    return await get();
  } catch (e) {
    // A Supabase without an optional column yet (sql/hub_messages.sql not rerun): read without it.
    const col = e && e.code === '42703' && ['data', 'files'].find(c => new RegExp(`\\b${c}\\b`).test(e.message || '') && SELECT.includes(',' + c));
    if (col) {
      SELECT = SELECT.replace(',' + col, '');
      return getRows(query);
    }
    throw e;
  }
}

// ---- State ----

const rowsById = new Map();      // id -> row
let hasOlder = false;
let loadingOlder = false;
const cardState = new Map();     // approval id -> 'sending' | 'sent'
let lastSig = '';
let lastMaxId = 0;
let showEarlier = false;         // "Show earlier messages" tapped; until reload or New chat
let floorId = 0;                 // on open, rows up to this id belong to an old conversation
let opening = true;              // the next successful load is the page opening
let bottomNext = false;          // the next render scrolls to the bottom
let hiddenAt = 0;

// ---- DOM ----

const $ = id => document.getElementById(id);
const listEl = $('list');
const pillEl = $('new-pill');
const inputEl = $('input');
const sendBtn = $('send');
const sendErrEl = $('send-err');
const countEl = $('count');
const workingEl = $('working');

function showSignIn(message) {
  stopPolling();
  rowsById.clear(); cardState.clear(); hasOlder = false; lastSig = ''; lastMaxId = 0;
  showEarlier = false; floorId = 0; opening = true;
  listEl.innerHTML = '';
  $('chat-view').hidden = true;
  $('signout').hidden = true;
  $('signin-view').hidden = false;
  $('signin-err').textContent = message || '';
  $('signin-btn').disabled = false;
}

function showChat() {
  $('signin-view').hidden = true;
  $('chat-view').hidden = false;
  $('signout').hidden = false;
}

// ---- Formatting ----

function sortedRows() {
  return [...rowsById.values()].sort((a, b) => a.id - b.id);
}

function fmtTime(d) {
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}
function dayKey(d) {
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}
function fmtDay(d) {
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate() - 1);
  if (dayKey(d) === dayKey(today)) return 'Today';
  if (dayKey(d) === dayKey(yest)) return 'Yesterday';
  const opts = { weekday: 'long', month: 'short', day: 'numeric' };
  if (d.getFullYear() !== today.getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('en-US', opts);
}

// Assistant formatting. Input is escaped FIRST; after that the only markup
// added is <strong> for **text** and <a> for https:// URLs. Bold runs before
// links so the ** pass can never land inside an href attribute; the URL pass
// stops at '<' so it can never swallow a <strong> tag.
function formatAssistant(body) {
  let html = escapeHtml(body);
  html = html.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
  // A URL ends at whitespace, '<', or an escaped < > " ' entity.
  html = html.replace(/https:\/\/(?:(?!&lt;|&gt;|&quot;|&#39;)[^\s<])+/g, (m) => {
    // Leave trailing punctuation out of the link (but not the ';' of '&amp;').
    let url = m, tail = '';
    while (/[.,!?:;)\]]$/.test(url) && !/&amp;$/.test(url)) {
      tail = url.slice(-1) + tail;
      url = url.slice(0, -1);
    }
    if (url.length <= 'https://'.length) return m;
    return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${tail}`;
  });
  return html;
}

// ---- Recaps (Oct 31): plan posts and change cards read as structure, not a wall ----
// Everything still goes through formatAssistant (escape first). The parser only
// decides layout: "Heading:" followed by "- item" lines becomes a section, long
// sections fold, "...and N more" becomes a quiet line, and two known shapes get
// a header: "Schedule from X: N deadlines, N prep to-dos, N study blocks added..."
// and a change card "#N Added to your schedule (K changes):" with "• Add ..." lines.
const expanded = new Set();         // "rowId:block" sections he opened
const FOLD_AT = 5;                  // a section longer than this shows 4 + "Show N more"
const CARD_FOLD = 6;                // change cards show this many rows folded
const BULLET_RE = /^\s*[-•]\s+(.*)$/;
const MORE_RE = /^\s*\.\.\.and (\d+) more\s*$/;
const PLAN_RE = /^Schedule from (.+?): (\d+) deadlines?, (\d+) prep to-dos?, (\d+) study blocks? added, worked out in (\d+) rounds? between the scheduler and the planner\.\s*$/;
const REFIT_RE = /^Refit for (.+?): (\d+) changes?\.\s*(.*)$/;
const ASK_RE = /^(.+): ((?:Mon|Tue|Wed|Thu|Fri|Sat|Sun) \w{3} \d{1,2})(?: \((.+)\))?$/;
const CARD_RE = /^#(\d+) (.+?)(?: \((\d+) changes?\))?:\s*$/;
const ADD_RE = /^Add (to-do|event): (.+) \((\d{4}-\d{2}-\d{2}|someday)(?: (\d{2}:\d{2}) \((\d+) min\))?(?:, (\w+) priority)?\)$/;

function parseBlocks(body) {
  const blocks = [];
  let cur = null;
  for (const raw of String(body).split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const b = line.match(BULLET_RE), m = line.match(MORE_RE);
    if (!line.trim()) { cur = null; continue; }
    if (m && cur && cur.type === 'list') { cur.more += Number(m[1]); continue; }
    if (b) {
      if (!cur || cur.type !== 'list') {
        let head = null;
        // "Notes:" right above the items is the section's heading
        if (cur && cur.type === 'p' && /:$/.test(cur.lines[cur.lines.length - 1])) {
          head = cur.lines.pop().slice(0, -1);
          if (!cur.lines.length) blocks.pop();
        }
        cur = { type: 'list', head, items: [], more: 0, foot: null };
        blocks.push(cur);
      }
      cur.items.push(b[1]);
      continue;
    }
    if (cur && cur.type === 'list' && cur.head && /^check these dates/i.test(cur.head) && !cur.foot) {
      cur.foot = line;    // "Right? Say yes, or tell me the real dates." belongs to the question
      continue;
    }
    if (!cur || cur.type !== 'p') { cur = { type: 'p', lines: [] }; blocks.push(cur); }
    cur.lines.push(line);
  }
  return blocks;
}

function secClass(head) {
  if (!head) return '';
  if (/^check these dates/i.test(head)) return ' hub-sec-ask';
  if (/^(no study time|couldn't|still not right|agendaai turned down)/i.test(head)) return ' hub-sec-warn';
  if (/^left out/i.test(head)) return ' hub-sec-quiet';
  return '';
}

function renderBlocks(blocks, rowId) {
  return blocks.map((bl, i) => {
    if (bl.type === 'p') return bl.lines.map(l => `<p class="hub-p">${formatAssistant(l)}</p>`).join('');
    const key = `${rowId}:${i}`;
    const open = expanded.has(key);
    const fold = bl.items.length > FOLD_AT && !open;
    const shown = fold ? bl.items.slice(0, FOLD_AT - 1) : bl.items;
    let html = `<section class="hub-sec${secClass(bl.head)}">`;
    if (bl.head) html += `<div class="hub-sec-head">${formatAssistant(bl.head)}</div>`;
    const ask = /^check these dates/i.test(bl.head || '');
    html += `<ul class="hub-ul">${shown.map(t => {
      const g = ask && t.match(ASK_RE);
      if (!g) return `<li>${formatAssistant(t)}</li>`;
      return `<li class="hub-ask-item"><span class="hub-ask-title">${formatAssistant(g[1].replace(/\s+due$/i, ''))}</span>`
        + `<span class="hub-ask-date">${escapeHtml(g[2])}</span>${g[3] ? `<span class="hub-ask-why">${formatAssistant(g[3])}</span>` : ''}</li>`;
    }).join('')}</ul>`;
    if (fold) html += `<button type="button" class="hub-more" data-expand="${key}">Show ${bl.items.length - shown.length} more</button>`;
    else if (bl.items.length > FOLD_AT) html += `<button type="button" class="hub-more" data-expand="${key}">Show less</button>`;
    if (bl.more) html += `<div class="hub-more-note">${bl.more} more not shown here</div>`;
    if (bl.foot) html += `<p class="hub-sec-foot">${formatAssistant(bl.foot)}</p>`;
    return html + '</section>';
  }).join('');
}

function statHtml(kind, n, label) {
  return `<span class="hub-stat"><span class="hub-mark hub-mark-${kind}" aria-hidden="true"></span><b>${n}</b> ${escapeHtml(label)}</span>`;
}


// ---- Review cards (Oct 31): agentkit/review.py counts, this draws. Every value is checked here: numbers through
// num(), text through escapeHtml, colors only from the app's own palette keys.
const REVIEW_COLORS = { blue: '#0a84ff', purple: '#8a5ce0', green: '#34c759', amber: '#ff9f0a', teal: '#30b0c7', rose: '#ff2d55', other: '#aeaeb2' };
const num = (v, d = 0) => (typeof v === 'number' && isFinite(v) ? v : d);
const arr = v => (Array.isArray(v) ? v : []);
function rvMins(m) { m = Math.round(num(m)); const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h}h ${r}m` : h ? `${h}h` : `${r}m`; }
function rvDay(ymd) { const d = new Date(String(ymd) + 'T12:00:00'); return isNaN(d) ? null : d; }

function rvGrid(data) {
  const days = arr(data.days).map(rvDay);
  const n = days.length;
  const long = n > 14;
  let head = '<span></span>';
  if (long) {
    for (let i = 0; i < n; i++) {
      if (!days[i] || (days[i].getDay() !== 0 && i !== 0)) continue;
      let span = 1; while (i + span < n && days[i + span] && days[i + span].getDay() !== 0) span++;
      head += `<span class="rv-day" style="grid-column: span ${span}">${span >= 5 && days[i] ? escapeHtml(days[i].toLocaleDateString('en-US', { month: 'short', day: 'numeric' })) : ''}</span>`;
      i += span - 1;
    }
  } else {
    head += days.map(d => `<span class="rv-day">${d ? escapeHtml(d.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 2)) : ''}</span>`).join('');
  }
  head += '<span></span>';
  const rows = arr(data.blocks).map(b => {
    const cells = String(b.cells || '').slice(0, n).padEnd(n, '.');
    return `<span class="rv-lab">${escapeHtml(b.name)}</span>`
      + [...cells].map(c => `<span class="rv-c rv-c-${c === '1' ? 'on' : c === '0' ? 'open' : c === '-' ? 'off' : 'none'}"></span>`).join('')
      + `<span class="rv-cnt">${num(b.on)}/${num(b.due)}</span>`;
  }).join('');
  return `<div class="rv-grid${long ? ' rv-grid-long' : ''}" style="--cols:${n}">${head}${rows}</div>`
    + '<div class="rv-key"><span><i class="rv-c rv-c-on"></i>checked</span><span><i class="rv-c rv-c-open"></i>open</span>'
    + '<span><i class="rv-c rv-c-off"></i>not due</span><span><i class="rv-c rv-c-none"></i>tracker not used</span></div>';
}

function rvFocus(data) {
  const f = data.focus || {};
  const types = arr(f.types);
  const days = arr(f.days);
  const dates = arr(data.days).map(rvDay);
  const W = 330, H = 88, long = days.length > 14, gap = long ? 2 : 7;
  const bw = Math.max(2, (W - gap * (days.length - 1)) / Math.max(1, days.length));
  const totals = days.map(d => arr(d).reduce((a, m) => a + num(m), 0));
  const max = Math.max(60, ...totals);
  let svg = `<svg class="rv-svg" viewBox="0 0 ${W} ${H + 14}" role="img" aria-label="Focus minutes by day">`;
  for (const m of [60, 120, 180, 240]) {
    if (m >= max) break;
    const y = H - m / max * H;
    svg += `<line x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="rv-gridline"/><text x="${W}" y="${(y - 3).toFixed(1)}" text-anchor="end" class="rv-axis">${m / 60}h</text>`;
  }
  days.forEach((d, i) => {
    const x = i * (bw + gap);
    let y = H;
    arr(d).forEach((m, t) => {
      m = num(m);
      if (m <= 0 || !types[t]) return;
      const h = m / max * H;
      y -= h;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${long ? 1.5 : 4}" fill="${REVIEW_COLORS[types[t].color] || REVIEW_COLORS.blue}"/>`;
    });
    if (!totals[i]) svg += `<rect x="${x.toFixed(1)}" y="${H - 2}" width="${bw.toFixed(1)}" height="2" rx="1" class="rv-zero"/>`;
    const dd = dates[i];
    if (dd && (!long || dd.getDay() === 0)) {
      const t = long ? dd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : dd.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 2);
      svg += `<text x="${(x + bw / 2).toFixed(1)}" y="${H + 11}" text-anchor="middle" class="rv-axis">${escapeHtml(t)}</text>`;
    }
  });
  svg += '</svg>';
  const legend = types.map(t => `<span><i style="background:${REVIEW_COLORS[t.color] || REVIEW_COLORS.blue}"></i>${escapeHtml(t.name)}</span>`).join('');
  return svg + `<div class="rv-legend">${legend}</div>`;
}

function rvHour(hhmm) {
  const m = String(hhmm || '').match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const h = Number(m[1]) + Number(m[2]) / 60;
  return h < 12 ? h + 24 : h;   // 1:10 AM -> 25.17, so a night reads left to right
}
function rvSleep(data) {
  const s = data.sleep || {};
  const nights = arr(s.nights);
  const dates = arr(data.days).map(rvDay);
  const long = nights.length > 14, rowH = long ? 7 : 14, W = 330, left = 30, w = W - left, A = 21, B = 35;
  const X = h => left + (Math.min(B, Math.max(A, h)) - A) / (B - A) * w;
  const H = nights.length * rowH;
  let svg = `<svg class="rv-svg" viewBox="0 0 ${W} ${H + 14}" role="img" aria-label="Sleep by night">`;
  for (const [lab, h] of [['10p', 22], ['12a', 24], ['2a', 26], ['4a', 28], ['6a', 30], ['8a', 32], ['10a', 34]]) {
    svg += `<line x1="${X(h)}" x2="${X(h)}" y1="0" y2="${H}" class="rv-gridline"/><text x="${X(h)}" y="${H + 11}" text-anchor="middle" class="rv-axis">${lab}</text>`;
  }
  svg += '<defs><linearGradient id="rv-sl" x1="0" x2="1"><stop offset="0" stop-color="#5e5ce6"/><stop offset="1" stop-color="#30b0c7"/></linearGradient></defs>';
  nights.forEach((n, i) => {
    const y = i * rowH + 2, bar = rowH - (long ? 2.5 : 5);
    const dd = dates[i];
    if (dd && (!long || i % 7 === 0)) svg += `<text x="0" y="${y + bar - 1}" class="rv-axis rv-axis-left">${escapeHtml(long ? dd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : dd.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 2))}</text>`;
    if (!n || typeof n !== 'object') return;
    const hours = num(n.hours, null);
    let a = rvHour(n.bed), b = rvHour(n.wake);
    if (a == null && b != null && hours) a = b - hours;
    if (b == null && a != null && hours) b = a + hours;
    if (a == null || b == null || b <= a) return;
    svg += `<rect x="${X(a).toFixed(1)}" y="${y}" width="${Math.max(2, X(b) - X(a)).toFixed(1)}" height="${bar}" rx="${bar / 2}" fill="url(#rv-sl)"/>`;
    if (!long && hours) svg += `<text x="${(X(b) + 4).toFixed(1)}" y="${y + bar - 1}" class="rv-axis rv-axis-left">${hours}h</text>`;
  });
  return svg + '</svg>';
}

function renderReview(data, rowId) {
  const kind = { week: 'Week in review', month: 'Month in review' }[data.kind] || 'Review';
  const f = data.focus || {}, s = data.sleep || {}, t = data.todos || {}, p = data.plans;
  const stats = [];
  if (num(data.due)) stats.push(`<span class="hub-stat"><span class="hub-mark hub-mark-block" aria-hidden="true"></span><b>${num(data.checked)}</b> of ${num(data.due)} blocks</span>`);
  if (num(f.sessions)) stats.push(`<span class="hub-stat"><span class="hub-mark hub-mark-event" aria-hidden="true"></span><b>${rvMins(f.minutes)}</b> focus</span>`);
  if (num(s.typical_hours, null) != null) stats.push(`<span class="hub-stat"><b>${num(s.typical_hours)}h</b> typical night</span>`);
  if (num(t.of)) stats.push(`<span class="hub-stat"><span class="hub-mark hub-mark-todo" aria-hidden="true"></span><b>${num(t.done)}</b> of ${num(t.of)} to-dos</span>`);
  let html = `<div class="hub-recap hub-recap-plan rv"><div class="hub-recap-head">`
    + `<span class="hub-recap-kind">${kind}${data.updated ? ' <span class="rv-updated">Updated</span>' : ''}</span>`
    + `<span class="hub-recap-title">${escapeHtml(data.label || '')}</span>`
    + (stats.length ? `<div class="hub-stats">${stats.join('')}</div>` : '') + '</div>';
  if (arr(data.blocks).length) {
    html += `<section class="rv-sec"><div class="rv-sec-h"><span class="rv-sec-t">Tracker</span>`
      + `<span class="rv-sec-n"><b>${num(data.checked)}</b> of <b>${num(data.due)}</b> due, ${num(data.tracked_days)} day${num(data.tracked_days) === 1 ? '' : 's'} tracked</span></div>${rvGrid(data)}</section>`;
  }
  if (num(f.sessions)) {
    html += `<section class="rv-sec"><div class="rv-sec-h"><span class="rv-sec-t">Focus by day</span>`
      + `<span class="rv-sec-n"><b>${rvMins(f.minutes)}</b> in <b>${num(f.sessions)}</b> session${num(f.sessions) === 1 ? '' : 's'}</span></div>${rvFocus(data)}</section>`;
  }
  if (num(s.count)) {
    html += `<section class="rv-sec"><div class="rv-sec-h"><span class="rv-sec-t">Sleep</span>`
      + `<span class="rv-sec-n">${s.typical_bed ? `bed around <b>${escapeHtml(s.typical_bed)}</b>` : `${num(s.count)} nights`}</span></div>${rvSleep(data)}</section>`;
  }
  if (p && typeof p === 'object') {
    const tile = (n, l) => `<div class="rv-plan"><b>${num(n)}</b><span>${l}</span></div>`;
    html += `<section class="rv-sec"><div class="rv-sec-h"><span class="rv-sec-t">Planner study blocks</span></div><div class="rv-plans">`
      + tile(p.on_time, 'done at their time') + tile(p.moved_done, 'moved, then done') + tile(p.let_go, 'let go')
      + (num(p.prep) ? tile(p.prep_done, `of ${num(p.prep)} prep done`) : tile(p.other_time, 'done another time')) + '</div></section>';
  }
  const read = arr(data.read).filter(x => typeof x === 'string' && x.trim());
  if (data.thin) {
    html += `<p class="rv-thin">Not much was logged in this stretch (${num(data.used_days)} day${num(data.used_days) === 1 ? '' : 's'} used), so there's no read.</p>`;
  } else if (read.length) {
    html += `<div class="rv-read"><div class="hub-sec-head">Claude's read</div>${read.map(r => `<p>${formatAssistant(r)}</p>`).join('')}`;
    const asks = arr(data.asks).filter(x => typeof x === 'string' && x.trim()).slice(0, 3);
    if (asks.length) html += `<div class="rv-asks">${asks.map(q => `<button type="button" class="rv-ask" data-ask="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join('')}</div>`;
    html += '</div>';
  } else {
    html += `<p class="rv-thin">The counts are in, but Claude's read didn't come this time. Ask about any of it.</p>`;
  }
  return html + '</div>';
}

function lines0(body) { return String(body).split('\n')[0]; }

// /today (agentkit today_text): "Saturday, Oct 31", then "Events: ...", "To-dos: ...", "Tracker: 5 of 9 checked.", ...
const TODAY_RE = /^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday), [A-Z][a-z]{2} \d{1,2}$/;
function renderToday(body) {
  const lines = body.split('\n');
  let html = `<div class="hub-recap hub-recap-plan hub-today"><div class="hub-recap-head"><span class="hub-recap-kind">Today</span>`
    + `<span class="hub-recap-title">${escapeHtml(lines[0])}</span></div><div class="hub-kv">`;
  let openShown = false;
  for (const raw of lines.slice(1)) {
    const l = raw.trim();
    let m;
    if ((m = l.match(/^Events: (.+)$/))) {
      const evs = m[1].split('; ').map(e => {
        const t = e.match(/^(\d{1,2}:\d{2} [AP]M) (.+)$/);
        return t ? `<div class="hub-op"><span class="hub-mark hub-mark-event" aria-hidden="true"></span><span class="hub-op-when">${escapeHtml(t[1].replace(':00', '').replace(' ', '').toLowerCase())}</span><span class="hub-op-title">${escapeHtml(t[2])}</span></div>`
                 : `<div class="hub-op"><span class="hub-mark hub-mark-allday" aria-hidden="true"></span><span class="hub-op-when">All day</span><span class="hub-op-title">${escapeHtml(e)}</span></div>`;
      }).join('');
      html += `<div class="hub-kv-k">Events</div><div class="hub-kv-v"><div class="hub-ops">${evs}</div></div>`;
    } else if ((m = l.match(/^Tracker: (\d+) of (\d+) checked\.$/))) {
      const done = Number(m[1]), all = Number(m[2]);
      const pips = Array.from({ length: Math.min(all, 24) }, (_, i) => `<i class="${i < done ? 'on' : ''}"></i>`).join('');
      html += `<div class="hub-kv-k">Tracker</div><div class="hub-kv-v"><span class="hub-pips" aria-hidden="true">${pips}</span> ${done} of ${all} checked</div>`;
    } else if ((m = l.match(/^Open in (.+?): (.+)$/))) {
      html += `<div class="hub-kv-k hub-kv-sub">${openShown ? '' : 'Still open'}</div><div class="hub-kv-v"><span class="hub-kv-space">${escapeHtml(m[1])}</span> ${escapeHtml(m[2])}</div>`;
      openShown = true;
    } else if ((m = l.match(/^To-dos: (.+?)(?: \(done: (.+)\))?$/))) {
      html += `<div class="hub-kv-k">To-dos</div><div class="hub-kv-v">${escapeHtml(m[1] === 'all done' ? 'All done' : m[1])}`
        + (m[2] ? `<span class="hub-op-sub">Done: ${escapeHtml(m[2])}</span>` : '') + '</div>';
    } else if ((m = l.match(/^([A-Z][\w-]*(?: [a-z]+)?): (.+)$/))) {
      html += `<div class="hub-kv-k">${escapeHtml(m[1])}</div><div class="hub-kv-v">${formatAssistant(m[2])}</div>`;
    } else if (l) {
      html += `<div class="hub-kv-k"></div><div class="hub-kv-v">${formatAssistant(l)}</div>`;
    }
  }
  return html + '</div></div>';
}

// The memory bot's post: "Memory: wrote up ...", "Profile: 1 new, ...", then "+ / ~ / -" lines.
function renderMemory(body) {
  const paras = [], diff = [];
  for (const l of body.split('\n')) {
    const m = l.match(/^([+~-]) (.+)$/);
    if (m) diff.push(m); else if (l.trim()) paras.push(l.trim());
  }
  const label = { '+': 'New', '~': 'Changed', '-': 'Removed' };
  const cls = { '+': 'add', '~': 'chg', '-': 'del' };
  return `<div class="hub-recap hub-memory"><div class="hub-recap-head hub-recap-head-tight"><span class="hub-recap-kind">Memory</span></div>`
    + paras.map(p => `<p class="hub-p">${formatAssistant(p.replace(/^Memory: (\w)/, (_, c) => c.toUpperCase()))}</p>`).join('')
    + (diff.length ? `<div class="hub-diff">${diff.map(([, k, t]) => `<div class="hub-diff-row hub-diff-${cls[k]}"><span class="hub-diff-tag">${label[k]}</span><span class="hub-diff-t">${formatAssistant(t)}</span></div>`).join('')}</div>` : '')
    + '</div>';
}

// An assistant row: a plain reply, or a recap with a header.
function renderAssistant(row) {
  if (row.data && typeof row.data === 'object' && row.data.type === 'review') {
    try { return renderReview(row.data, row.id); } catch (e) { /* a card it can't draw falls back to the text */ }
  }
  const body = String(row.body == null ? '' : row.body);
  if (TODAY_RE.test(lines0(body))) return renderToday(body);
  if (/^Undid #\d+:$/.test(lines0(body))) {
    const { items, tail } = splitBullets(body.split('\n').slice(1));
    return `<div class="hub-recap hub-recap-ops"><div class="hub-card-head"><span class="hub-card-title">${escapeHtml(lines0(body).slice(0, -1))}</span>`
      + `<span class="hub-card-count">${items.length}</span></div>${opsHtml(items, `${row.id}:undo`, false)}`
      + (tail.length ? `<div class="hub-card-why">${tail.map(formatAssistant).join('<br>')}</div>` : '') + '</div>';
  }
  if (/^(Memory|Profile): /.test(lines0(body))) return renderMemory(body);
  if (/^\[[\w-]+\] (didn't run|failed to start)|^The schedule job #\d+ failed|^Couldn't /.test(body)) {
    return `<div class="hub-bubble hub-bubble-warn">${formatAssistant(body)}</div>`;
  }
  if (/^From a Claude chat: /.test(body) && !body.includes('\n')) {
    return `<div class="hub-handoff"><span class="hub-handoff-dot" aria-hidden="true"></span><span>${formatAssistant(body.slice(20))}</span></div>`;
  }
  const lines = body.split('\n');
  const plan = lines[0].match(PLAN_RE);
  const refit = !plan && lines[0].match(REFIT_RE);
  const blocks = parseBlocks(plan || refit ? lines.slice(1).join('\n') : body);
  const rich = plan || refit || blocks.some(b => b.type === 'list');
  if (!rich) return `<div class="hub-bubble">${formatAssistant(body)}</div>`;
  let head = '';
  if (plan) {
    const [, src, d, p, b, r] = plan;
    head = `<div class="hub-recap-head"><span class="hub-recap-kind">New plan</span>`
      + `<span class="hub-recap-title">${escapeHtml(src)}</span>`
      + `<div class="hub-stats">${statHtml('due', d, Number(d) === 1 ? 'deadline' : 'deadlines')}`
      + `${statHtml('todo', p, 'prep')}${statHtml('block', b, Number(b) === 1 ? 'study block' : 'study blocks')}</div>`
      + `<span class="hub-recap-note">Worked out in ${escapeHtml(r)} round${r === '1' ? '' : 's'}</span></div>`;
  } else if (refit) {
    head = `<div class="hub-recap-head"><span class="hub-recap-kind">Refit</span>`
      + `<span class="hub-recap-title">${escapeHtml(refit[1])}</span>`
      + `<div class="hub-stats">${statHtml('block', refit[2], Number(refit[2]) === 1 ? 'change' : 'changes')}</div></div>`;
    if (refit[3]) blocks.unshift({ type: 'p', lines: [refit[3]] });
  }
  return `<div class="hub-recap${plan || refit ? ' hub-recap-plan' : ''}">${head}${renderBlocks(blocks, row.id)}</div>`;
}

function fmtCardDay(ymd) {
  const d = new Date(ymd + 'T12:00:00');
  return isNaN(d) ? ymd : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtClock(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am', h12 = ((h + 11) % 12) + 1;
  return m ? `${h12}:${String(m).padStart(2, '0')}${ap}` : `${h12}${ap}`;
}
function fmtMins(n) {
  const h = Math.floor(n / 60), r = n % 60;
  return h && r ? `${h}h ${r}m` : h ? `${h}h` : `${r}m`;
}

// One "• ..." change line (agentkit describe_op) -> a row: { marker, when, title, sub, date, time, dur, right }.
const OP_CHANGE_RE = /^Change (event|to-do) (['"])(.+)\2: (.+)$/;
const OP_DELETE_RE = /^Delete (event|to-do): (.+) \((\d{4}-\d{2}-\d{2}|someday)\)$/;
const OP_BACK_RE = /^Bring back (event|to-do): (.+) \((\d{4}-\d{2}-\d{2}|someday)\)$/;
const OP_CHECK_RE = /^(Check|Uncheck) (.+) \((.+)\) for (\d{4}-\d{2}-\d{2})$/;
const OP_DONE_RE = /^Mark (done|not done): (.+)$/;
const OP_LOG_RE = /^Log (.+?): (.+) for (\d{4}-\d{2}-\d{2})$/;
function parseOp(t, schedule) {
  let a = t.match(ADD_RE);
  if (a) {
    const [, kind, title, date, time, dur, prio] = a;
    const marker = prio === 'high' ? 'due' : kind === 'to-do' ? 'todo' : (schedule ? 'block' : 'event');
    return { marker, title, date, time, dur: dur ? Number(dur) : null };
  }
  if ((a = t.match(OP_CHANGE_RE))) {
    const [, , , title, rest] = a;
    let date = null, time = null, dur = null; const other = [];
    for (const bit of rest.split(/, (?=(?:date|time|title|notes|priority|all day))/)) {
      let m;
      if ((m = bit.match(/^date to (\d{4}-\d{2}-\d{2}|someday)$/))) date = m[1];
      else if ((m = bit.match(/^time to (\d{1,2}):(\d{2}) ([AP]M) for (\d+) min$/))) {
        const h = (Number(m[1]) % 12) + (m[3] === 'PM' ? 12 : 0);
        time = `${String(h).padStart(2, '0')}:${m[2]}`; dur = Number(m[4]);
      } else other.push(bit);
    }
    const to = [date ? (date === 'someday' ? 'Someday' : fmtCardDay(date)) : '', time ? fmtClock(time) : ''].filter(Boolean).join(', ');
    return { marker: 'move', title, date, time, dur, sub: [to ? `Moved to ${to}` : '', ...other].filter(Boolean).join('. ') };
  }
  if ((a = t.match(OP_DELETE_RE))) return { marker: 'del', title: a[2], date: a[3], sub: 'Removed' };
  if ((a = t.match(OP_BACK_RE))) return { marker: 'back', title: a[2], date: a[3], sub: 'Back on the calendar' };
  if ((a = t.match(OP_CHECK_RE))) return { marker: a[1] === 'Check' ? 'check' : 'uncheck', title: a[2], date: a[4], sub: a[3] };
  if ((a = t.match(OP_DONE_RE))) return { marker: a[1] === 'done' ? 'check' : 'uncheck', title: a[2], sub: a[1] === 'done' ? 'Done' : 'Not done' };
  if ((a = t.match(OP_LOG_RE))) return { marker: 'log', title: a[1], date: a[3], right: a[2] };
  return { marker: 'dot', text: t };
}

function opsHtml(items, key, schedule) {
  const parsed = items.map(t => parseOp(t, schedule));
  const dated = parsed.length > 0 && parsed.every(x => x.date);
  if (dated) parsed.sort((a, b) => (a.date + (a.marker === 'due' ? '0' : '1') + (a.time || '99'))
    .localeCompare(b.date + (b.marker === 'due' ? '0' : '1') + (b.time || '99')));
  const open = expanded.has(key);
  const fold = parsed.length > CARD_FOLD + 1 && !open;
  const shown = fold ? parsed.slice(0, CARD_FOLD) : parsed;
  let lastDay = '';
  let html = '<div class="hub-ops">' + shown.map(x => {
    if (x.text != null) return `<div class="hub-op"><span class="hub-mark hub-mark-dot" aria-hidden="true"></span><span class="hub-op-when"></span><span class="hub-op-title">${formatAssistant(x.text)}</span></div>`;
    let day = '';
    if (dated && x.date !== lastDay) { lastDay = x.date; day = `<div class="hub-op-day">${escapeHtml(x.date === 'someday' ? 'Someday' : fmtCardDay(x.date))}</div>`; }
    const when = x.marker === 'due' ? 'Due' : x.time ? fmtClock(x.time) : '';
    const title = x.marker === 'due' ? (x.title.replace(/\s+due$/i, '') || x.title) : x.title;
    const right = x.dur ? fmtMins(x.dur) : (x.right || '');
    return day + `<div class="hub-op hub-op-${x.marker}"><span class="hub-mark hub-mark-${x.marker}" aria-hidden="true"></span>`
      + `<span class="hub-op-when">${escapeHtml(when)}</span><span class="hub-op-title">${escapeHtml(title)}`
      + (x.sub ? `<span class="hub-op-sub">${escapeHtml(x.sub)}</span>` : '') + '</span>'
      + (right ? `<span class="hub-op-dur">${escapeHtml(right)}</span>` : '') + '</div>';
  }).join('') + '</div>';
  if (fold) html += `<button type="button" class="hub-more" data-expand="${key}">Show all ${parsed.length}</button>`;
  else if (parsed.length > CARD_FOLD + 1) html += `<button type="button" class="hub-more" data-expand="${key}">Show less</button>`;
  return html;
}

function splitBullets(lines) {
  const items = [], tail = [];
  for (const l of lines) {
    const b = l.match(/^\s*•\s+(.*)$/);
    if (b) items.push(b[1]); else if (l.trim()) tail.push(l.trim());
  }
  return { items, tail };
}

// A change card's body: "#12 Added to your schedule (39 changes):", "• ..." lines, then the why.
function renderCardBody(row) {
  const body = String(row.body == null ? '' : row.body);
  const lines = body.split('\n');
  const head = lines[0].match(CARD_RE);
  if (!head) return renderProposal(body);
  const { items, tail } = splitBullets(lines.slice(1));
  let html = `<div class="hub-card-head"><span class="hub-card-num">#${escapeHtml(head[1])}</span>`
    + `<span class="hub-card-title">${escapeHtml(head[2])}</span>`
    + (head[3] ? `<span class="hub-card-count">${escapeHtml(head[3])}</span>` : '') + '</div>';
  html += opsHtml(items, `${row.id}:card`, /schedule/i.test(head[2]));
  if (tail.length) html += `<div class="hub-card-why">${tail.map(formatAssistant).join('<br>')}</div>`;
  return html;
}

// An approval for something other than an AgendaAI change (a mail draft, a tool call).
const PROPOSAL_RE = /^#(\d+) (\S+) wants to call (\S+)$/;
function renderProposal(body) {
  const lines = body.split('\n');
  const m = lines[0].match(PROPOSAL_RE);
  if (!m) return `<div class="hub-card-body">${formatAssistant(body)}</div>`;
  const tool = m[3].replace(/^mcp__/, '').split('__');
  const toolName = tool.length > 1 ? `${tool[0][0].toUpperCase()}${tool[0].slice(1)}: ${tool.slice(1).join(' ').replace(/_/g, ' ')}` : m[3];
  let input = null;
  try { input = JSON.parse(lines.slice(1).join('\n')); } catch (e) { input = null; }
  let html = `<div class="hub-card-head"><span class="hub-card-num">#${escapeHtml(m[1])}</span>`
    + `<span class="hub-card-title">${/send|reply|draft/i.test(m[3]) && input && (input.to || input.subject) ? 'Send this email?' : 'Approve this?'}</span></div>`;
  if (input && typeof input === 'object' && (input.to || input.subject || input.body)) {
    const field = (k, v) => v ? `<div class="hub-mail-row"><span class="hub-mail-k">${k}</span><span class="hub-mail-v">${escapeHtml(Array.isArray(v) ? v.join(', ') : String(v))}</span></div>` : '';
    html += `<div class="hub-mail">${field('To', input.to)}${field('Cc', input.cc)}${field('Subject', input.subject)}`
      + (input.body ? `<div class="hub-mail-body">${escapeHtml(String(input.body))}</div>` : '') + '</div>';
  } else {
    html += `<pre class="hub-pre">${escapeHtml(lines.slice(1).join('\n'))}</pre>`;
  }
  return html + `<div class="hub-card-why">${escapeHtml(m[2])} wants to use ${escapeHtml(toolName)}</div>`;
}

function cardIsSent(row) {
  if (cardState.has(row.id)) return true;
  for (const r of rowsById.values()) if (r.role === 'button' && r.ref_id === row.id) return true;
  return false;
}

function renderApproval(row) {
  let actions;
  const groups = Array.isArray(row.buttons) ? row.buttons.filter(Array.isArray) : null;
  if (!groups || !groups.length) {
    actions = '<div class="hub-card-note">Decided</div>';
  } else {
    const state = cardState.get(row.id) || (cardIsSent(row) ? 'sent' : null);
    const disabled = state ? ' disabled' : '';
    actions = groups.map((group, gi) => {
      const btns = group.map((btn, bi) => {
        if (!Array.isArray(btn) || btn.length < 2) return '';
        const label = String(btn[0]);
        const primary = /^approve$/i.test(label.trim()) ? ' btn-primary' : '';
        const undo = /^undo$/i.test(label.trim()) ? ' hub-undo' : '';
        return `<button type="button" class="btn${primary}${undo}" data-card="${Number(row.id)}" data-g="${gi}" data-b="${bi}"${disabled}>${escapeHtml(label)}</button>`;
      }).join('');
      return `<div class="hub-card-row">${btns}</div>`;
    }).join('');
    if (state === 'sending') actions += '<div class="hub-card-note">Sending…</div>';
    else if (state === 'sent') actions += '<div class="hub-card-note">Sent. Waiting for your PC…</div>';
  }
  const first = String(row.body || '').split('\n')[0];
  return `<div class="hub-card${CARD_RE.test(first) || PROPOSAL_RE.test(first) ? ' hub-card-change' : ''}">${renderCardBody(row)}${actions}</div>`;
}

function renderRow(row) {
  const d = new Date(row.created_at);
  const time = isNaN(d) ? '' : `<div class="hub-time">${escapeHtml(fmtTime(d))}</div>`;
  const body = row.body == null ? '' : String(row.body);
  switch (row.role) {
    case 'user': {
      const label = COMMAND_LABELS[body.trim()];
      const files = Array.isArray(row.files) ? row.files.filter(f => f && typeof f === 'object') : [];
      if (files.length) {
        const names = files.map(f => String(f.name == null ? '' : f.name));
        const chips = `<div class="hub-chips">${names.map(n => `<span class="hub-chip"><span class="hub-chip-name">File: ${escapeHtml(n)}</span></span>`).join('')}</div>`;
        // The auto "Sent a.pdf, b.png" body shows as just the chips.
        const bubble = body === 'Sent ' + names.join(', ') ? '' : `<div class="hub-bubble">${escapeHtml(label || body)}</div>`;
        return `<div class="hub-msg me">${bubble}${chips}${time}</div>`;
      }
      return `<div class="hub-msg me"><div class="hub-bubble">${escapeHtml(label || body)}</div>${time}</div>`;
    }
    case 'assistant':
      return `<div class="hub-msg them">${renderAssistant(row)}${time}</div>`;
    case 'status':
      return `<div class="hub-status">${escapeHtml(body)}</div>`;
    case 'approval':
      return `<div class="hub-msg them">${renderApproval(row)}${time}</div>`;
    default:
      return '';   // 'button' rows (and anything unknown) aren't shown
  }
}

// ---- Conversations (display only) ----

function isNewChat(row) {
  return row.role === 'user' && row.body != null && String(row.body).trim() === '/new';
}
// Indices where a conversation starts: the row after a /new, or a row 45+
// minutes after the one before it.
function boundaryStarts(rows) {
  const starts = new Set();
  for (let i = 1; i < rows.length; i++) {
    if (isNewChat(rows[i - 1])) starts.add(i);
    const gap = new Date(rows[i].created_at) - new Date(rows[i - 1].created_at);
    if (gap >= CONVO_GAP_MS) starts.add(i);
  }
  if (rows.length && isNewChat(rows[rows.length - 1])) starts.add(rows.length);
  return starts;
}
// Index of the first row of the current conversation.
function currentStart(rows, starts) {
  let start = 0;
  for (const i of starts) start = Math.max(start, i);
  while (start < rows.length && rows[start].id <= floorId) start++;
  return start;
}
// Runs on the first successful load after sign-in or page load.
function applyOpen() {
  if (!opening) return;
  opening = false;
  const rows = sortedRows();
  const newest = rows[rows.length - 1];
  if (newest && Date.now() - new Date(newest.created_at).getTime() >= CONVO_GAP_MS) floorId = newest.id;
  bottomNext = true;
}

function nearBottom() {
  return listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 80;
}
function scrollToBottom() {
  listEl.scrollTop = listEl.scrollHeight;
  pillEl.hidden = true;
}

const seenIds = new Set();   // rows already painted once (no entrance for them again)
let painted = false;
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Re-renders the list only when something visible changed.
function render({ forceBottom = false, keepTopAnchor = false } = {}) {
  if (bottomNext && !keepTopAnchor) { forceBottom = true; bottomNext = false; }
  const rows = sortedRows();
  const sig = JSON.stringify([hasOlder, loadingOlder, showEarlier, floorId, [...cardState], [...expanded], rows.map(r => [r.id, r.status, r.buttons, r.body, r.data ? 1 : 0])]);
  updateWorking();
  if (sig === lastSig && !forceBottom) return;
  lastSig = sig;

  const wasNearBottom = nearBottom();
  const prevHeight = listEl.scrollHeight;
  const prevTop = listEl.scrollTop;

  const starts = boundaryStarts(rows);
  const start = showEarlier ? 0 : currentStart(rows, starts);

  let html = '';
  if (!showEarlier && (start > 0 || hasOlder)) {
    html += '<div class="hub-older"><button type="button" class="btn" id="show-earlier">Show earlier messages</button></div>';
  } else if (hasOlder) {
    html += `<div class="hub-older"><button type="button" class="btn" id="load-older"${loadingOlder ? ' disabled' : ''}>${loadingOlder ? 'Loading…' : 'Load older'}</button></div>`;
  }
  let lastDay = '';
  let shown = 0;
  let divider = false;
  for (let i = start; i < rows.length; i++) {
    const row = rows[i];
    if (showEarlier && starts.has(i)) divider = true;
    const piece = renderRow(row);
    if (!piece) continue;
    if (divider && shown) html += '<div class="hub-divider">New conversation</div>';
    divider = false;
    const d = new Date(row.created_at);
    if (!isNaN(d) && dayKey(d) !== lastDay) {
      lastDay = dayKey(d);
      html += `<div class="hub-day">${escapeHtml(fmtDay(d))}</div>`;
    }
    // A row he hasn't seen yet arrives with a short rise; the first paint doesn't animate.
    const fresh = painted && !seenIds.has(row.id);
    seenIds.add(row.id);
    html += fresh ? `<div class="hub-in">${piece}</div>` : piece;
    shown++;
  }
  painted = true;
  if (!shown) html += '<div class="hub-empty">No messages yet. Say hi, or tap Morning to start a check-in.</div>';
  listEl.innerHTML = html;

  const maxId = rows.length ? rows[rows.length - 1].id : 0;
  const grew = maxId > lastMaxId;
  lastMaxId = Math.max(lastMaxId, maxId);

  if (keepTopAnchor) {
    listEl.scrollTop = prevTop + (listEl.scrollHeight - prevHeight);
  } else if (forceBottom) {
    scrollToBottom();
    // Again after layout settles (the notices and working line can resize the list).
    requestAnimationFrame(scrollToBottom);
  } else if (wasNearBottom) {
    // Follow a new reply down smoothly instead of jumping.
    if (grew && !reduceMotion) { listEl.scrollTo({ top: listEl.scrollHeight, behavior: 'smooth' }); pillEl.hidden = true; }
    else scrollToBottom();
  } else {
    listEl.scrollTop = prevTop;
    if (grew) pillEl.hidden = false;
  }
}

// ---- "Is it working" line ----

function workingState() {
  const rows = sortedRows();
  for (let i = rows.length - 1; i >= 0; i--) {
    const r = rows[i];
    if (r.role === 'status') continue;
    if (r.role !== 'user' && r.role !== 'button') return null;
    if (r.status === 'done') {
      // A tap whose card the PC has decided (buttons -> null) is finished,
      // even if the PC only answered with a status line.
      if (r.role === 'button') {
        const card = rowsById.get(r.ref_id);
        if (card && card.role === 'approval' && card.buttons == null) return null;
      }
      // Rows are sorted by id, so the last one is the newest row of any role.
      const quiet = Date.now() - new Date(rows[rows.length - 1].created_at).getTime();
      return quiet >= SILENT_MS ? 'silent' : 'working';
    }
    if (r.status === 'new') {
      const age = Date.now() - new Date(r.created_at).getTime();
      return age >= STALE_MS ? 'stale' : 'sending';
    }
    return null;
  }
  return null;
}

function updateWorking() {
  const s = workingState();
  workingEl.classList.toggle('warn', s === 'stale' || s === 'silent');
  if (s === 'sending') workingEl.innerHTML = 'Sending to your PC…';
  else if (s === 'stale') workingEl.innerHTML = "Your PC hasn't picked this up. Is it on, with the Hub running?";
  else if (s === 'working') workingEl.innerHTML = '<span class="hub-typing" aria-hidden="true"><i></i><i></i><i></i></span><span>Working on it</span>';
  else if (s === 'silent') workingEl.innerHTML = 'No reply after 5 minutes. Check that your PC is on and the Hub is running.';
  else workingEl.innerHTML = '';
  workingEl.hidden = !s;
  return s;
}

// ---- Errors ----

function noteSuccess() {
  $('setup-notice').hidden = true;
  $('retry-notice').hidden = true;
}
function noteError(e) {
  if (e && e.status === 401) return;       // hubFetch already showed sign-in
  if (isMissingTable(e)) {
    $('setup-notice').hidden = false;
    $('retry-notice').hidden = true;
  } else {
    $('retry-notice').hidden = false;
  }
}

// ---- Loading and polling ----

function mergeRows(rows) {
  for (const r of rows) if (r && typeof r.id === 'number') rowsById.set(r.id, r);
}

async function loadInitial() {
  try {
    const rows = await getRows(`&order=id.desc&limit=${PAGE}`);
    rowsById.clear();
    mergeRows(rows.reverse());
    hasOlder = rows.length === PAGE;
    noteSuccess();
    applyOpen();
    render({ forceBottom: true });
  } catch (e) {
    noteError(e);
    if (pollingOn) render({ forceBottom: true });
  }
}

function showEarlierMessages() {
  const rows = sortedRows();
  const hidden = currentStart(rows, boundaryStarts(rows)) > 0;
  showEarlier = true;
  render({ keepTopAnchor: true });
  if (!hidden && hasOlder) loadOlder();   // nothing loaded was hidden: fetch the older page
}

async function loadOlder() {
  if (loadingOlder || !rowsById.size) return;
  const oldest = Math.min(...rowsById.keys());
  loadingOlder = true;
  render({ keepTopAnchor: true });
  try {
    const rows = await getRows(`&id=lt.${oldest}&order=id.desc&limit=${PAGE}`);
    mergeRows(rows);
    hasOlder = rows.length === PAGE;
    noteSuccess();
  } catch (e) {
    noteError(e);
  }
  loadingOlder = false;
  render({ keepTopAnchor: true });
}

// Exactly one poll timer. Every path that schedules goes through
// schedulePoll(), which clears the previous timer first.
let pollTimer = null;
let polling = false;        // a poll request is in flight
let pollAgain = false;      // pollNow() was called during an in-flight poll
let pollingOn = false;      // signed in and showing the chat

function stopPolling() {
  pollingOn = false;
  clearTimeout(pollTimer);
  pollTimer = null;
}
function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = null;
  if (!pollingOn || document.hidden) return;
  // Fast while the line shows, except after 5 silent minutes: back to 10 s.
  const s = workingState();
  pollTimer = setTimeout(poll, s && s !== 'silent' ? FAST_MS : SLOW_MS);
}
function pollNow() {
  if (polling) { pollAgain = true; return; }
  clearTimeout(pollTimer);
  pollTimer = null;
  poll();
}

async function poll() {
  pollTimer = null;
  if (!pollingOn || document.hidden) return;
  polling = true;
  try {
    mergeRows(await getRows(`&order=id.desc&limit=${POLL_LIMIT}`));
    noteSuccess();
    applyOpen();
  } catch (e) {
    noteError(e);
  }
  polling = false;
  if (!pollingOn) return;
  render();
  if (pollAgain) { pollAgain = false; pollNow(); return; }
  schedulePoll();
}

async function startChat() {
  showChat();
  pollingOn = true;
  await loadInitial();
  if (pollingOn) schedulePoll();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    hiddenAt = Date.now();
    clearTimeout(pollTimer);
    pollTimer = null;
  } else if (pollingOn) {
    if (hiddenAt && Date.now() - hiddenAt >= AWAY_MS) { bottomNext = true; render(); }
    pollNow();
  }
});

// ---- Sending ----

async function insertRow(payload) {
  const r = await hubFetch('/hub_messages', {
    method: 'POST',
    headers: { Prefer: 'return=representation' },
    body: JSON.stringify(payload)
  });
  const rows = await r.json().catch(() => []);
  mergeRows(Array.isArray(rows) ? rows : [rows]);
}

// ---- Attachments ----
// Files go to Storage only (bucket hub-files, folder = user id); the row
// carries just {path, name, type, size}. Nothing is kept in localStorage.

let attached = [];   // File objects picked in the composer

function fileSafeName(name) {
  let n = String(name).replace(/[^A-Za-z0-9._-]/g, '_') || 'file';
  if (n.length > 80) {
    const ext = (n.match(/\.[A-Za-z0-9]{1,8}$/) || [''])[0];
    n = n.slice(0, 80 - ext.length) + ext;
  }
  return n;
}

let lastUploadTs = 0;
function uploadTs() {   // unique per upload, so two same-named files never collide
  lastUploadTs = Math.max(Date.now(), lastUploadTs + 1);
  return lastUploadTs;
}

function renderAttached() {
  const el = $('attach-chips');
  el.innerHTML = attached.map((f, i) =>
    `<span class="hub-chip"><span class="hub-chip-name">${escapeHtml(f.name)}</span><button type="button" class="hub-chip-x" data-remove="${i}" aria-label="Remove ${escapeHtml(f.name)}">×</button></span>`
  ).join('');
  el.hidden = !attached.length;
}

function addFiles(list) {
  const errs = [];
  for (const f of list) {
    const ext = (f.name.match(/\.([^.]+)$/) || ['', ''])[1].toLowerCase();
    if (!FILE_EXTS.includes(ext)) errs.push(`${f.name}: only PDF, images, text, or Word files`);
    else if (f.size > MAX_FILE_BYTES) errs.push(`${f.name}: Up to 3 files, 10 MB each`);
    else if (attached.length >= MAX_FILES) errs.push('Up to 3 files, 10 MB each');
    else attached.push(f);
  }
  sendErrEl.textContent = errs.length ? [...new Set(errs)].join(' · ') : '';
  renderAttached();
}

// One file -> Storage, with one 401 -> refresh -> retry like hubFetch.
async function uploadFile(file, path) {
  const session = getHubSession();
  if (!session) { showSignIn(); throw new HubError('Not signed in', 401); }
  const put = (token) => fetch(`${SUPABASE_URL}/storage/v1/object/hub-files/${path}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${token}`,
      'Content-Type': file.type || 'application/octet-stream',
      'x-upsert': 'false'
    },
    body: file
  });
  let r = await put(session.access_token);
  if (r.status === 401) {
    const refreshed = await hubRefreshToken();
    if (!refreshed) {
      clearHubSession();
      showSignIn('Your Hub sign-in expired. Please sign in again.');
      throw new HubError('Session expired', 401);
    }
    r = await put(getHubSession().access_token);
  }
  if (!r.ok) {
    const txt = await r.text().catch(() => '');
    let msg;
    try { const j = JSON.parse(txt); msg = j.message || j.error; } catch {}
    throw new HubError(msg || `Upload failed (${r.status})`, r.status);
  }
}

let sending = false;
async function sendText(raw, fromComposer) {
  const text = String(raw || '').trim();
  const files = fromComposer ? attached.slice() : [];
  if ((!text && !files.length) || sending) return;
  if (text.length > MAX_LEN) { sendErrEl.textContent = `Too long: ${text.length} / ${MAX_LEN} characters.`; return; }
  sending = true;
  sendBtn.disabled = true;
  $('attach').disabled = true;
  document.querySelectorAll('.hub-quick .btn').forEach(b => { b.disabled = true; });
  sendErrEl.textContent = '';
  try {
    if (files.length) {
      // Every upload first; if any fails, nothing is inserted.
      const userId = getHubSession() && getHubSession().user_id;
      const meta = [];
      sendBtn.textContent = 'Uploading…';
      for (const f of files) {
        const path = `${userId}/${uploadTs()}-${fileSafeName(f.name)}`;
        try { await uploadFile(f, path); }
        catch (e) {
          if (e.status !== 401) sendErrEl.textContent = `Couldn't upload ${f.name}: ${e.message || 'network error'}`;
          return;
        }
        meta.push({ path, name: f.name, type: f.type, size: f.size });
      }
      sendBtn.textContent = 'Send';
      await insertRow({ role: 'user', body: text || ('Sent ' + files.map(f => f.name).join(', ')), files: meta });
      attached = [];
      renderAttached();
    } else {
      await insertRow({ role: 'user', body: text });
    }
    if (fromComposer) { inputEl.value = ''; onInput(); }
    if (text === '/new') showEarlier = false;   // the new conversation starts on a clean screen
    noteSuccess();
    render({ forceBottom: true });
    pollNow();
  } catch (e) {
    if (e.status !== 401) {
      sendErrEl.textContent = isMissingTable(e)
        ? "Couldn't send: the Hub isn't set up yet."
        : `Couldn't send: ${e.message || 'network error'}. Your message is still here.`;
      noteError(e);
    }
  } finally {
    sending = false;
    sendBtn.disabled = false;
    sendBtn.textContent = 'Send';
    $('attach').disabled = false;
    document.querySelectorAll('.hub-quick .btn').forEach(b => { b.disabled = false; });
  }
}

async function tapCardButton(cardId, gi, bi) {
  const row = rowsById.get(cardId);
  if (!row || row.role !== 'approval' || cardIsSent(row)) return;   // already tapped
  const btn = Array.isArray(row.buttons) && Array.isArray(row.buttons[gi]) ? row.buttons[gi][bi] : null;
  if (!Array.isArray(btn) || btn.length < 2) return;
  const data = String(btn[1]);
  cardState.set(cardId, 'sending');     // set synchronously: a second tap returns above
  render();
  try {
    await insertRow({ role: 'button', body: data, ref_id: cardId });
    cardState.set(cardId, 'sent');
    noteSuccess();
    render();
    pollNow();
  } catch (e) {
    cardState.delete(cardId);
    if (e.status !== 401) {
      sendErrEl.textContent = `Couldn't send your choice: ${e.message || 'network error'}. Try again.`;
      noteError(e);
      render();
    }
  }
}

// ---- Composer ----

const finePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

function onInput() {
  inputEl.style.height = 'auto';
  inputEl.style.height = inputEl.scrollHeight + 2 + 'px';   // max-height in CSS caps it at ~6 lines
  const n = inputEl.value.length;
  countEl.hidden = n <= COUNT_FROM;
  countEl.textContent = `${n} / ${MAX_LEN}`;
  countEl.classList.toggle('over', n >= MAX_LEN);
}
inputEl.addEventListener('input', onInput);
inputEl.addEventListener('keydown', (e) => {
  if (finePointer && e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendText(inputEl.value, true);
  }
});
$('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  sendText(inputEl.value, true);
});
$('attach').addEventListener('click', () => { if (!sending) $('attach-input').click(); });
$('attach-input').addEventListener('change', (e) => {
  addFiles([...e.target.files]);
  e.target.value = '';   // so the same file can be picked again
});
$('attach-chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-remove]');
  if (!b || sending) return;
  attached.splice(Number(b.dataset.remove), 1);
  sendErrEl.textContent = '';
  renderAttached();
});
document.querySelector('.hub-quick').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cmd]');
  if (b) sendText(b.dataset.cmd, false);
});

listEl.addEventListener('click', (e) => {
  if (e.target.closest('#load-older')) { loadOlder(); return; }
  if (e.target.closest('#show-earlier')) { showEarlierMessages(); return; }
  const q = e.target.closest('[data-ask]');
  if (q) { sendText(q.dataset.ask, false); return; }
  const x = e.target.closest('[data-expand]');
  if (x) {
    const k = x.dataset.expand;
    if (expanded.has(k)) expanded.delete(k); else expanded.add(k);
    render();
    return;
  }
  const b = e.target.closest('button[data-card]');
  if (b && !b.disabled) tapCardButton(Number(b.dataset.card), Number(b.dataset.g), Number(b.dataset.b));
});
listEl.addEventListener('scroll', () => { if (nearBottom()) pillEl.hidden = true; });
pillEl.addEventListener('click', scrollToBottom);

// ---- Sign in / out ----

$('signin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('signin-email').value.trim();
  const password = $('signin-password').value;
  const errEl = $('signin-err');
  if (!email || !password) { errEl.textContent = 'Enter your email and password.'; return; }
  $('signin-btn').disabled = true;
  errEl.textContent = '';
  try {
    await hubSignIn(email, password);
    $('signin-password').value = '';
    startChat();
  } catch (err) {
    errEl.textContent = err.message || 'Sign-in failed.';
  } finally {
    $('signin-btn').disabled = false;
  }
});

$('signout').addEventListener('click', () => {
  clearHubSession();
  showSignIn();
});

// ---- Boot ----

if (getHubSession()) startChat();
else showSignIn();
</script>
</body>
</html>
